# ⚡ APEX FORTRESS NGINX CONFIG ⚡
# Serves the built SPA with strict security headers and no server tokens.

server {
    listen 8080;
    server_name _;

    # Hide nginx version.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for performance.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — all routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (hashed filenames from Vite build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Strict security headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' https://owmyubghyfbexvvzbehh.supabase.co; connect-src 'self' https://owmyubghyfbexvvzbehh.supabase.co wss://owmyubghyfbexvvzbehh.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Deny access to dotfiles.
    location ~ /\. {
        deny all;
    }
}